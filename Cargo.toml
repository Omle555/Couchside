[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.85"
repository = "https://github.com/your-name/solidfin"

[workspace.dependencies]
solidfin-core = { path = "crates/solidfin-core" }
solidfin-db = { path = "crates/solidfin-db" }
solidfin-library = { path = "crates/solidfin-library" }
solidfin-metadata = { path = "crates/solidfin-metadata" }

anyhow = "1"
argon2 = "0.5"
axum = "0.8"
hex = "0.4"
notify = { version = "8", default-features = false }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "derive", "migrate"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "net", "process", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "0.8"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
windows = { version = "0.62", default-features = false, features = ["std", "Foundation_Collections", "Graphics_Imaging", "Media_Ocr", "Storage_Streams", "Win32_Foundation", "Win32_UI_Shell"] }
windows-service = "0.7"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
