<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Solidfin</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header id="topbar" class="topbar" hidden>
    <a class="brand" href="#/">
      <img src="/favicon.svg" alt="" width="26" height="26">
      <span>Solidfin</span>
    </a>
    <nav class="nav">
      <a href="#/" data-nav="home">Home</a>
      <a href="#/movies" data-nav="movies">Movies</a>
      <a href="#/shows" data-nav="shows">TV Shows</a>
    </nav>
    <form id="search-form" class="search" role="search">
      <input id="search-input" type="search" placeholder="Search" aria-label="Search titles" autocomplete="off">
    </form>
    <div class="user">
      <a href="#/settings" data-nav="settings" title="Settings">Settings</a>
      <button id="logout" class="link" type="button">Sign out</button>
    </div>
  </header>
  <main id="app" class="app"><div class="loading">Loading…</div></main>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script src="/app.js"></script>
</body>
</html>
