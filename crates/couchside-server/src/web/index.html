<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Couchside</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    /* Splash styles live here so it paints before app.css and app.js arrive. */
    html, body { margin: 0; background: #0e1015; }
    .splash {
      position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 100;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #0e1015; color: #e8eaf0;
      font-family: "Segoe UI Variable", "Segoe UI", system-ui, -apple-system, sans-serif;
      opacity: 1; -webkit-transition: opacity .35s ease; transition: opacity .35s ease;
    }
    .splash.done { opacity: 0; pointer-events: none; }
    .splash-mark { display: flex; align-items: center; margin-bottom: 28px; }
    .splash-mark svg { width: 44px; height: 44px; margin-right: 14px; }
    .splash-name { font-size: 30px; font-weight: 700; letter-spacing: .3px; }
    .splash-track {
      position: relative; overflow: hidden;
      width: 240px; height: 3px; border-radius: 3px; background: #20242d;
    }
    .splash-bar {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 3px;
      background: #7c9cff;
      -webkit-transform-origin: 0 50%; transform-origin: 0 50%;
      -webkit-transform: scaleX(0); transform: scaleX(0);
      -webkit-transition: -webkit-transform .4s ease; transition: transform .4s ease;
    }
    .splash.indeterminate .splash-bar {
      width: 35%;
      -webkit-transform: none; transform: none;
      -webkit-animation: splash-slide 1.3s ease-in-out infinite; animation: splash-slide 1.3s ease-in-out infinite;
    }
    @-webkit-keyframes splash-slide { from { left: -35%; } to { left: 100%; } }
    @keyframes splash-slide { from { left: -35%; } to { left: 100%; } }
    .splash-status { margin-top: 14px; min-height: 20px; font-size: 14px; color: #9aa1b2; }
    @media (prefers-reduced-motion: reduce) {
      .splash, .splash-bar { -webkit-transition: none; transition: none; }
      .splash.indeterminate .splash-bar { width: 100%; left: 0; opacity: .45; -webkit-animation: none; animation: none; }
    }
  </style>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div id="splash" class="splash indeterminate" role="progressbar" aria-label="Loading Couchside" aria-valuemin="0" aria-valuemax="100">
    <div class="splash-mark">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <defs>
          <linearGradient id="splash-g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#7c9cff"/>
            <stop offset="1" stop-color="#4b5fd6"/>
          </linearGradient>
        </defs>
        <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#splash-g)"/>
        <path d="M26 20 L46 32 L26 44 Z" fill="#fff"/>
      </svg>
      <span class="splash-name">Couchside</span>
    </div>
    <div class="splash-track"><div class="splash-bar" id="splash-bar"></div></div>
    <div class="splash-status" id="splash-status" aria-live="polite">Starting…</div>
  </div>
  <div id="scanbar" class="scanbar" role="progressbar" aria-label="Library scan" aria-valuemin="0" aria-valuemax="100" hidden><div class="scanbar-fill"></div></div>
  <header id="topbar" class="topbar" hidden>
    <a class="brand" href="#/">
      <img src="/favicon.svg" alt="" width="26" height="26">
      <span>Couchside</span>
    </a>
    <nav class="nav">
      <a href="#/" data-nav="home">Home</a>
      <a href="#/movies" data-nav="movies">Movies</a>
      <a href="#/shows" data-nav="shows">TV Shows</a>
    </nav>
    <form id="search-form" class="search" role="search">
      <input id="search-input" type="search" placeholder="Search" aria-label="Search titles" autocomplete="off">
    </form>
    <div class="user">
      <a href="#/settings" data-nav="settings" title="Settings">Settings</a>
      <button id="logout" class="link" type="button">Sign out</button>
    </div>
  </header>
  <main id="app" class="app"></main>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script src="/app.js"></script>
</body>
</html>
